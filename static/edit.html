<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<title>Edit Greets Graf</title>
		<link rel="stylesheet" href="style.css">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<script src="utils.js"></script>
		<script src="common.js"></script>
		<script src="edit.js"></script>
	</head>

	<body>
		<div id="main-wrapper">
			<main id="main-content">
				<h1>Add greetings</h1>

				<label for="in_prod">Demofinder 2000:</label>
				<div id="prod_search" class="autocomplete">
					<input type="text" id="in_prod" placeholder="Prod name...">
				</div>
				<div style="margin-top: 8px; color: var(--text-muted);">
					or enter Pouet prod id:
					<input type="text" id="in_prod_id" style="width: 80px;">
					<button onclick="loadProd()">Load</button>
				</div>

				<div id="prod_container" style="display: none;">
					<div id="prod"></div>

					<h3>Greetings:</h3>
					<div id="greets_list"></div>

					<h3>Add new greeting</h3>
					<label for="greet_add_group">To group:</label>
					<span class="autocomplete">
						<input type="text" id="greet_add_group" placeholder="Group name">
					</span>
					<label style="margin-left: 16px;">Note:</label>
					<input type="text" id="greet_add_note" placeholder="e.g. 13:37 or nfo" style="margin-left: 8px;">
					<button id="greet_add_button" disabled>Add</button>
				</div>
			</main>
			<footer>
				Haphazardly coded by <a href="https://www.pouet.net/user.php?who=24180">provod</a>/<a href="https://www.pouet.net/groups.php?which=13728">jetlag</a> <small>(I clearly have no idea what I'm doing)</small><br>
				Sources: <a href="https://github.com/w23/greetsgraf">github.com/w23/greetsgraf</a>.
				Questions? <a href="https://www.pouet.net/topic.php?which=12099">Pouet.net thread</a>
			</footer>
		</div>
	</body>
</html>
